{% load i18n %}<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body { margin:0; padding:0; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif; line-height:1.6; color:#475569; background:#f8fafc; }
    .container { max-width:600px; margin:0 auto; padding:20px; }
    .card { background:#fff; border-radius:12px; overflow:hidden; box-shadow:0 4px 12px rgba(0,0,0,.08); }
    .header { padding:26px 24px; text-align:center; color:#fff; }
    .header h1 { margin:0; font-size:20px; font-weight:700; }
    .header--teal   { background:#0f766e; }
    .header--green  { background:#10b981; }
    .header--amber  { background:#f59e0b; }
    .header--red    { background:#dc2626; }
    .header--blue   { background:#2563eb; }
    .content { padding:30px 26px; }
    .content p { margin:0 0 14px; }
    .panel { background:#f8fafc; border-inline-start:4px solid #0f766e; border-radius:8px; padding:16px 18px; margin:18px 0; }
    .panel--warn { background:#fffbeb; border-inline-start-color:#f59e0b; }
    .panel--warn p, .panel--warn strong { color:#92400e; }
    .row { display:flex; justify-content:space-between; padding:7px 0; font-size:14px; }
    .row span:first-child { font-weight:600; color:#0f172a; }
    .amount { font-size:26px; font-weight:800; color:#047857; margin:6px 0 2px; }
    .btn { display:inline-block; background:#0f766e; color:#fff !important; padding:12px 26px; border-radius:8px; text-decoration:none; font-weight:600; font-size:14px; margin-top:18px; }
    .muted { font-size:13px; color:#64748b; }
    .footer { background:#f8fafc; padding:18px; text-align:center; font-size:12px; color:#64748b; border-top:1px solid #e2e8f0; }
    .footer a { color:#0f766e; text-decoration:none; }
    ul { margin:0 0 14px; padding-inline-start:20px; }
    li { margin-bottom:7px; }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <div class="header header--{% block accent %}teal{% endblock %}">
        <h1>{% block heading %}Rentora{% endblock %}</h1>
      </div>
      <div class="content">
        {% block body %}{% endblock %}
      </div>
      <div class="footer">
        <p>&copy; {% now "Y" %} Rentora. {% trans "All rights reserved." %}</p>
        <p><a href="{{ SITE_URL }}/faq/">{% trans "FAQ" %}</a> &nbsp;·&nbsp; <a href="{{ SITE_URL }}/contact/">{% trans "Contact Support" %}</a></p>
      </div>
    </div>
  </div>
</body>
</html>
